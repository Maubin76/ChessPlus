# Intégration continue (même organisation que PatrimoinePlus) : à chaque push sur main
# (seulement), lance tous les tests JVM (:core, :data, :puzzle-builder, :app) puis construit
# l'APK debug. Les rapports de tests sont joints à l'exécution en cas d'échec. Les branches de
# travail ne la déclenchent pas ; elle reste lançable à la main depuis l'onglet Actions
# (workflow_dispatch).
#
# La base des problèmes (app/src/main/assets/puzzles.db) n'est pas versionnée : les jobs qui
# produisent un APK release la génèrent à partir du CSV Lichess, téléchargé une fois par mois
# (cache).
#
# Version release vérifiée avant toute publication : l'APK release (R8) est installé et lancé
# sur un émulateur (ci/release-smoke-android.sh).
#
# Tests verts sur main : publication d'une release. La version de gradle.properties est publiée
# telle quelle si son tag n'existe pas encore (première version, numéro changé à la main) ;
# sinon elle augmente de 0.1 (0.1 → 0.2, numéro Android + 1), commitée sur main par la CI.
# Puis APK signé (clé des secrets KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD) et release GitHub
# « vX.Y » avec l'APK.
#
# Les captures des @Preview (validateDebugScreenshotTest) ne sont pas vérifiées ici : leur rendu
# dépend du système (polices, anticrénelage) et les références sont produites sous Windows.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Exécutions à la suite, sans en interrompre une : une release coupée en plein milieu
# laisserait une version commitée sans ses fichiers.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Lancer les tests
        run: ./gradlew :core:allTests :data:allTests :puzzle-builder:test :app:testDebugUnitTest --stacktrace

      - name: Construire l'APK debug
        run: ./gradlew :app:assembleDebug

      - name: Joindre les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: |
            core/build/reports/tests/
            core/build/test-results/
            data/build/reports/tests/
            data/build/test-results/
            puzzle-builder/build/reports/tests/
            puzzle-builder/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

  android-smoke:
    name: APK release sur émulateur
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Mois courant (clé du cache du CSV Lichess)
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Récupérer le CSV Lichess (cache mensuel)
        id: csv
        uses: actions/cache@v6
        with:
          path: lichess_db_puzzle.csv.zst
          key: lichess-puzzles-${{ steps.month.outputs.month }}

      - name: Télécharger le CSV Lichess
        if: steps.csv.outputs.cache-hit != 'true'
        run: curl -sSfL --retry 3 -o lichess_db_puzzle.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst

      - name: Générer la base des problèmes
        run: ./gradlew :puzzle-builder:run --args="lichess_db_puzzle.csv.zst"

      - name: Construire l'APK release (R8, clé de debug, toutes architectures)
        run: ./gradlew :app:assembleRelease -Pchessplus.allAbis=true

      - name: Activer la virtualisation (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'APK sur un émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/release-smoke-android.sh app/build/outputs/apk/release/app-release.apk

  version:
    name: Numéro de version
    needs: [tests, android-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - name: Récupérer le code et les tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Augmenter la version si elle est déjà publiée
        id: bump
        run: |
          vVersion=$(grep '^chessplus.version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          vCode=$(grep '^chessplus.versionCode=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if git rev-parse -q --verify "refs/tags/v$vVersion" > /dev/null
          then
            vMajor=$(echo "$vVersion" | cut -d. -f1)
            vMinor=$(echo "$vVersion" | cut -d. -f2)
            vVersion="$vMajor.$((vMinor + 1))"
            vCode=$((vCode + 1))
            sed -i "s/^chessplus.version=.*/chessplus.version=$vVersion/; s/^chessplus.versionCode=.*/chessplus.versionCode=$vCode/" gradle.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "Version $vVersion [skip ci]"
            git push origin HEAD:refs/heads/main
          fi
          echo "version=$vVersion" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version publiée : $vVersion (code $vCode)"

  android:
    name: APK signé
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code de la version
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Vérifier la présence de la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]
          then
            echo "::error::Secrets KEYSTORE_BASE64, KEY_ALIAS et KEY_PASSWORD absents : pas de release signée avec la clé de debug."
            exit 1
          fi

      - name: Mois courant (clé du cache du CSV Lichess)
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Récupérer le CSV Lichess (cache mensuel)
        id: csv
        uses: actions/cache@v6
        with:
          path: lichess_db_puzzle.csv.zst
          key: lichess-puzzles-${{ steps.month.outputs.month }}

      - name: Télécharger le CSV Lichess
        if: steps.csv.outputs.cache-hit != 'true'
        run: curl -sSfL --retry 3 -o lichess_db_puzzle.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst

      - name: Générer la base des problèmes
        run: ./gradlew :puzzle-builder:run --args="lichess_db_puzzle.csv.zst"

      - name: Construire l'APK signé
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chessplus.jks"
          ./gradlew :app:assembleRelease \
            "-Pchessplus.keystore=$RUNNER_TEMP/chessplus.jks" \
            "-Pchessplus.keyAlias=$KEY_ALIAS" \
            "-Pchessplus.keyPassword=$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk "ChessPlus-${{ needs.version.outputs.version }}.apk"
          rm "$RUNNER_TEMP/chessplus.jks"

      - name: Garder l'APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ChessPlus-*.apk
          retention-days: 7

  release:
    name: Release GitHub
    needs: [version, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Récupérer le code et les tags
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Récupérer l'APK
        uses: actions/download-artifact@v8
        with:
          path: fichiers
          merge-multiple: true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          vPrevious=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$vPrevious" ]
          then
            echo "## Changements depuis $vPrevious" > notes.md
            git log --no-merges --format='- %s' "$vPrevious..$SHA" | grep -v '^- Version [0-9]' >> notes.md || true
          else
            echo "Première version publiée." > notes.md
          fi
          gh release create "v$VERSION" fichiers/* --target "$SHA" --title "ChessPlus $VERSION" --notes-file notes.md
