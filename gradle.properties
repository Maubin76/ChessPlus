# Propriétés Gradle de ChessPlus.

# Version de l'application, augmentée par la CI à chaque release (X.Y → X.Y+1, code + 1).
chessplus.version=1.0
chessplus.versionCode=2

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Captures des @Preview (plugin com.android.compose.screenshot)
android.experimental.enableScreenshotTest=true
